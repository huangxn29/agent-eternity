# ============================================
# Agent Awake 配置文件
# ============================================
# 此文件为默认配置，可通过命令行参数覆盖
# 首次运行 platform-init.sh 时会交互式生成此文件
# ============================================

# ============ 基础配置 ============

# 平台数据目录（存放所有Agent数据）
# 建议使用绝对路径，默认为相对路径
DATA_DIR="./agent-awake-data"

# 主人名称（必填）
# 示例: OWNER="张三"
OWNER=""

# 主人邮箱（必填）
# 示例: OWNER_EMAIL="user@example.com"
OWNER_EMAIL=""

# 时区（用于USER.md）
TIMEZONE="Asia/Shanghai"

# ============ 引擎配置 ============

# 引擎类型（当前支持 openclaw）
ENGINE="openclaw"

# 引擎安装目录
ENGINE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)/engines"

# ============ 网络配置 ============

# 网络模式: host | bridge
# host: 容器直接使用宿主机网络（当前默认，性能好但隔离性差）
# bridge: 使用Docker bridge网络 + 端口映射（更安全隔离）
NETWORK_MODE="host"

# Docker网络名称（仅bridge模式使用）
DOCKER_NETWORK="agent-awake-net"

# ============ 端口配置 ============

# Gateway基础端口
# Agent-N 的 Gateway 端口 = GW_PORT_BASE + N - 1
GW_PORT_BASE="18789"

# ClawRouter基础端口
# Agent-N 的 ClawRouter 端口 = CR_PORT_BASE + N - 1
CR_PORT_BASE="8402"

# ============ 资源配额 ============

# 默认CPU配额（每个Agent）
DEFAULT_CPU="1.0"

# 默认内存配额（每个Agent）
# 支持 M/G 后缀，如 "1536M" 或 "1.5G"
DEFAULT_MEMORY="1536M"

# ============ 镜像配置 ============

# 基础镜像名称
IMAGE_NAME="agent-awake-base:latest"

# 镜像构建目录
IMAGES_DIR="${DATA_DIR}/images/openclaw-agent"

# ============ 功能开关 ============

# 是否自动安装Docker（首次使用）
AUTO_INSTALL_DOCKER="true"

# 是否自动构建镜像
AUTO_BUILD_IMAGE="true"

# 启动等待时间（秒）
STARTUP_WAIT="15"

# 健康检查重试次数
HEALTH_CHECK_RETRIES="10"

# 健康检查间隔（秒）
HEALTH_CHECK_INTERVAL="3"

# ============ Emoji配置 ============

# Agent Emoji列表（按顺序自动分配）
EMOJI_LIST=(🔮 ⚡ 🌊 🔥 🌟 ❄️ 🍀 🎯 💎 🦊 🐉 🦄 🌈 🎪 🎭 🚀 🌌)

# ============ 高级配置 ============

# OpenClaw版本
OPENCLAW_VERSION="2026.5.3-1"

# ClawRouter包名
CLAWROUTER_PACKAGE="@blockrun/clawrouter"

# 主模型
PRIMARY_MODEL="clawrouter/free"

# ============ 兼容性配置 ============

# 保留旧路径别名（向后兼容）
LEGACY_DATA_DIR="/app/data/agent-awake"
